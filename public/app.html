/* ──────────────────────────────────────────────────────────────────────
   Design tokens — light UI: snow ground, graphite ink, warm neutrals,

:root {
  /* Palette */
  --basalt: #121410; --moss: #2B3A26; --madrone: #B85B33; --clay: #B07859;
  --parchment: #EBE2CC; --granite: #6B6F65; --alpenglow: #D1573F; --ochre: #D9A828;
  --snow: #FFFFFF; --cloud: #F4F2EC; --mist: #E6E3D9; --fog: #D6D2C6;
  --graphite: #0A0A0A; --slate: #2A2A2A; --smoke: #6F6E6A;
  --compass: #FED20B; --ember: #D94B1A; --leaf: #1B7A47;

  /* Role tokens */
  --bg: var(--snow);
  --surface: var(--snow);
  --surface2: var(--cloud);
  --surface3: var(--mist);
  --text: var(--graphite);
  --text2: var(--slate);
  --text-dim: var(--smoke);
  --border: color-mix(in oklab, var(--graphite) 14%, transparent);
  --border-soft: color-mix(in oklab, var(--graphite) 8%, transparent);
  --border-strong: color-mix(in oklab, var(--graphite) 32%, transparent);
  --ring: color-mix(in oklab, var(--graphite) 18%, transparent);
  --link: color-mix(in oklab, var(--alpenglow) 82%, var(--graphite));
  --danger: var(--ember);

  /* Radii — 4px chips, 6px inputs, 12px cards, 16px large, pills for buttons */

  /* Motion */
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

  /* Tracked-caps labels */
  --tr-caps: 0.14em;
}
html.dark {

  --surface2: color-mix(in oklab, var(--parchment) 10%, var(--basalt));
  --surface3: color-mix(in oklab, var(--parchment) 14%, var(--basalt));
  --text: var(--parchment);

.sync-status.saving .sync-dot { background: var(--smoke); }
.sync-status.saved .sync-dot { background: var(--leaf); }

.admin-link { color: var(--parchment); font-size: 13px; text-decoration: none; padding: 5px 12px; border-radius: var(--r-pill); border: 1px solid color-mix(in oklab, var(--parchment) 26%, transparent); display: inline-flex; align-items: center; gap: 6px; }

.impersonate-banner button:hover { background: color-mix(in oklab, var(--graphite) 20%, transparent); }

/* Admin tables */
.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.admin-table th { text-align: left; padding: 10px 12px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); font-weight: 500; border-bottom: 1px solid var(--border); background: var(--surface2); }
.admin-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
.admin-table tr:last-child td { border-bottom: none; }
.admin-table tr:hover td { background: var(--surface2); }
.admin-table .actions { white-space: nowrap; display: flex; gap: 6px; }

/* Drag reorder */
.drag-handle { cursor: grab; color: var(--text-dim); touch-action: none; user-select: none; font-size: 13px; line-height: 1; }
.drag-handle:active { cursor: grabbing; }
.data-table td.drag-handle-cell { width: 20px; text-align: center; padding: 6px 4px; }
tr.drag-over > td { border-top: 2px solid var(--alpenglow); }
.day-card.drag-over, .admin-camera-card.drag-over { border-top: 2px solid var(--alpenglow); }
.admin-camera-card .drag-handle { position: absolute; top: 8px; left: 10px; }

/* CSV import drop zone */
.csv-drop { border: 2px dashed var(--border-strong); border-radius: var(--r-card); padding: 22px; text-align: center; color: var(--text-dim); font-size: 13px; margin-bottom: 14px; cursor: pointer; transition: border-color .15s var(--ease), background .15s var(--ease); }
.csv-drop:hover, .csv-drop:focus-visible { border-color: var(--alpenglow); outline: none; }
.csv-drop.dragover { border-color: var(--alpenglow); background: var(--surface2); color: var(--text); }

/* Ellipsis trigger legible on basalt nav */
.nav .ellipsis-btn { color: color-mix(in oklab, var(--parchment) 70%, transparent); }
.nav .ellipsis-btn:hover { background: color-mix(in oklab, var(--parchment) 12%, transparent); color: var(--parchment); }

@media (max-width: 768px) {
  .form-grid { grid-template-columns: 1fr; }
  .form-grid.cols-3, .form-grid.cols-4 { grid-template-columns: 1fr 1fr; }
  .projects-grid { grid-template-columns: 1fr; }
  .nav { padding: 10px 16px; gap: 10px; }

}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

<body>
<div id="app">
  <div class="skel-nav"></div>
  <div class="skel-container">
    <div class="skel-section-header"><div class="skel"></div></div>
    <div class="projects-grid">
      <div class="skel-card"><div class="skel skel-title"></div><div class="skel skel-meta"></div><div class="skel-stats"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
      <div class="skel-card"><div class="skel skel-title"></div><div class="skel skel-meta"></div><div class="skel-stats"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
      <div class="skel-card"><div class="skel skel-title"></div><div class="skel skel-meta"></div><div class="skel-stats"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = '/api';
let currentUser = null;
let impersonatingUserId = null;

// ===== Auth =====
window.addEventListener('load', async () => {
  await window.Clerk.load();
  if (!window.Clerk.user) {
    window.location.href = '/login.html';
    return;
  }
  // Sync user profile from Clerk to DB and get user data in one call
  const clerkUser = window.Clerk.user;
  currentUser = await api('/me', { method: 'PUT', body: {
    email: clerkUser.primaryEmailAddress?.emailAddress || '',
    name: clerkUser.fullName || '',
  }});
  loadPersistedPending();
  if (pending.size) retryPending();
  render();
});
window.addEventListener('online', retryPending);
setInterval(retryPending, 30000);

// ===== Utilities =====
async function api(path, opts = {}) {
  const token = await window.Clerk.session.getToken();
  const headers = {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${token}`,
    ...opts.headers,
  };
  if (impersonatingUserId) {
    headers['x-impersonate-user'] = impersonatingUserId;
  }
  const res = await fetch(API + path, {
    ...opts,
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!res.ok) {
    let msg = `${res.status} ${res.statusText}`;
    try { const data = await res.json(); if (data?.error) msg = data.error; } catch {}
    throw Object.assign(new Error(msg), { status: res.status });
  }
  return res.json();
}

function toast(msg) {
  const el = document.getElementById('toast');
  clearTimeout(el._timer);
  el.classList.remove('with-action');
  el.textContent = msg;
  el.classList.add('show');
  el._timer = setTimeout(() => el.classList.remove('show'), 2000);
}

function toastUndo(msg, onUndo) {
  const el = document.getElementById('toast');
  clearTimeout(el._timer);
  el.innerHTML = `${esc(msg)} &middot; <button class="toast-undo" type="button">Undo</button>`;
  el.classList.add('show', 'with-action');
  el.querySelector('.toast-undo').addEventListener('click', () => {
    clearTimeout(el._timer);
    el.classList.remove('show', 'with-action');
    onUndo();
  }, { once: true });
  el._timer = setTimeout(() => el.classList.remove('show', 'with-action'), 6000);
}

// Custom modal system
function focusableIn(container) {
  return [...container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.offsetParent !== null);
}

function showModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(overlay);
  overlay._previouslyFocused = document.activeElement;
  requestAnimationFrame(() => overlay.classList.add('show'));
  const modal = overlay.querySelector('.modal');
  modal.tabIndex = -1;
  (focusableIn(modal)[0] || modal).focus();
  overlay._trapHandler = e => {
    if (e.key !== 'Tab') return;
    const items = focusableIn(modal);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  overlay.addEventListener('keydown', overlay._trapHandler);
  return overlay;
}

function closeModal(overlay) {
  overlay.classList.remove('show');
  overlay.removeEventListener('keydown', overlay._trapHandler);
  setTimeout(() => overlay.remove(), 150);
  overlay._previouslyFocused?.focus?.();
}

function modalPrompt(title, defaultValue = '', inputType = 'text') {
  return new Promise(resolve => {
    const overlay = showModal(`
      <h3>${esc(title)}</h3>
      <input type="${esc(inputType)}" class="modal-input" value="${esc(defaultValue)}" autofocus>
      <div class="modal-actions">
        <button class="btn modal-cancel">Cancel</button>
        <button class="btn btn-primary modal-ok">OK</button>
      </div>
    `);
    const input = overlay.querySelector('.modal-input');
    const ok = () => { const v = input.value; closeModal(overlay); resolve(v || null); };
    const cancel = () => { closeModal(overlay); resolve(null); };
    overlay.querySelector('.modal-ok').addEventListener('click', ok);
    overlay.querySelector('.modal-cancel').addEventListener('click', cancel);
    overlay.addEventListener('click', e => { if (e.target === overlay) cancel(); });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') cancel(); });
    input.focus();
    input.select();
  });
}

function modalConfirm(message) {
  return new Promise(resolve => {
    const overlay = showModal(`
      <h3>Are you sure?</h3>
      <p>${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn modal-cancel">Cancel</button>
        <button class="btn btn-danger modal-ok">Delete</button>
      </div>
    `);
    overlay.querySelector('.modal-ok').addEventListener('click', () => { closeModal(overlay); resolve(true); });
    overlay.querySelector('.modal-cancel').addEventListener('click', () => { closeModal(overlay); resolve(false); });
    overlay.addEventListener('click', e => { if (e.target === overlay) { closeModal(overlay); resolve(false); } });
    document.addEventListener('keydown', function handler(e) {
      if (e.key === 'Escape') { document.removeEventListener('keydown', handler); closeModal(overlay); resolve(false); }
      if (e.key === 'Enter') { document.removeEventListener('keydown', handler); closeModal(overlay); resolve(true); }
    });
  });
}

function navigate(hash) {
  window.location.hash = hash;
}

function fmtNum(n) { return Number(n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtInt(n) { return Number(n||0).toLocaleString('en-US'); }
function fmtSize(gb) {
  gb = Number(gb) || 0;
  return gb >= 1000 ? (gb/1000).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' TB'
    : gb.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' GB';
}

function formatDate(d) {
  if (!d) return '';
  return new Date(d+'T00:00:00').toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
}

// ===== Router =====
function getRoute() {
  const h = window.location.hash.slice(1) || '/';
  const projMatch = h.match(/^\/project\/(\d+)$/);
  const dayMatch = h.match(/^\/project\/(\d+)\/day\/(\d+)$/);
  if (h === '/admin/users') return { page: 'admin-users' };
  if (dayMatch) return { page: 'day', projectId: dayMatch[1], dayId: dayMatch[2] };
  if (projMatch) return { page: 'project', projectId: projMatch[1] };
  return { page: 'dashboard' };
}

window.addEventListener('hashchange', render);

// ===== Render =====
async function render() {
  if (!window.Clerk || !window.Clerk.user) return;
  const scrollY = window.scrollY;
  const route = getRoute();
  const app = document.getElementById('app');
  try {
    if (route.page === 'admin-users') await renderAdminUsers(app);
    else if (route.page === 'dashboard') await renderDashboard(app);
    else if (route.page === 'project') await renderProject(app, route.projectId);
    else if (route.page === 'day') await renderDay(app, route.projectId, route.dayId);
  } catch (err) {
    console.error(err);
    app.innerHTML = '<div class="container"><div class="card"><h2>Error</h2><p>' + err.message + '</p></div></div>';
  }
  paintSyncStatus();
  window.scrollTo(0, scrollY);
}

const sunIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3.5"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1M12.7 12.7l-1.1-1.1M4.4 4.4l-1.1-1.1"/></svg>';
const moonIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8.7A6 6 0 1 1 7.3 2 4.7 4.7 0 0 0 14 8.7z"/></svg>';

function themeToggleHTML() {
  const isDark = document.documentElement.classList.contains('dark');
  const label = isDark ? 'Switch to light theme' : 'Switch to dark theme';
  return `<button class="back-btn theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="${label}" title="${label}">${isDark ? sunIcon : moonIcon}</button>`;
}

function toggleTheme() {
  const dark = !document.documentElement.classList.contains('dark');
  document.documentElement.classList.toggle('dark', dark);
  try { localStorage.setItem('dit-theme', dark ? 'dark' : 'light'); } catch {}
  const btn = document.getElementById('themeToggle');
  if (btn) btn.outerHTML = themeToggleHTML();
}

function userMenuHTML() {
  const user = window.Clerk.user;
  const avatarUrl = user.imageUrl;
  const name = user.fullName || user.primaryEmailAddress?.emailAddress || 'User';
  return `${themeToggleHTML()}<div class="user-menu">
    <span class="sync-status" id="syncStatus" aria-live="polite"><span class="sync-dot"></span><span class="sync-label"></span></span>
    ${currentUser?.isAdmin ? '<a class="admin-link" href="#/admin/users"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1a2.5 2.5 0 0 0-2.5 2.5v1A2.5 2.5 0 0 0 8 7a2.5 2.5 0 0 0 2.5-2.5v-1A2.5 2.5 0 0 0 8 1z"/><path d="M3 14v-1a5 5 0 0 1 10 0v1"/></svg> Admin</a>' : ''}
    <img class="user-avatar" src="${avatarUrl}" alt="">
    <span class="user-name">${esc(name)}</span>
    <button class="sign-out-btn" onclick="signOut()">Sign out</button>
  </div>`;
}

function impersonateBannerHTML() {
  if (!impersonatingUserId) return '';
  return `<div class="impersonate-banner">
    Viewing as user ${esc(impersonatingUserId)}
    <button onclick="stopImpersonating()">Exit</button>
  </div>`;
}

async function signOut() {
  await window.Clerk.signOut();
  window.location.href = '/login.html';
}

function startImpersonating(userId) {
  impersonatingUserId = userId;
  navigate('#/');
}

function stopImpersonating() {
  impersonatingUserId = null;
  navigate('#/admin/users');
}

// ===== Dashboard =====
async function renderDashboard(app) {
  const projects = await api('/projects');
  if (!Array.isArray(projects)) {
    console.error('API /projects returned:', projects);
    app.innerHTML = '<div class="container"><div class="card"><h2>Error</h2><p>' + esc(projects.error || JSON.stringify(projects)) + '</p></div></div>';
    return;
  }
  const active = projects.filter(p => !p.archived);
  const completed = projects.filter(p => p.archived);

  app.innerHTML = `
    ${impersonateBannerHTML()}
    <div class="nav"><a class="wordmark" href="#/">DIT report</a><div class="spacer"></div>
      <button class="btn btn-primary" onclick="createProject()">+ New Project</button>
      ${userMenuHTML()}
    </div>
    <div class="container">
      ${projects.length === 0 ? `
        <div class="card" style="text-align:center;padding:48px">
          <h2 style="margin-bottom:8px">No projects yet</h2>
          <p style="color:var(--text-dim);margin-bottom:16px">Create a project to start logging offloads, benchmarks, and shoot days.</p>
          <button class="btn btn-primary" onclick="createProject()">+ New Project</button>
        </div>` : `

        <!-- Active Projects -->
        <div class="dashboard-section">
          <div class="dashboard-section-header">
            <h2>Active Projects</h2>
            <span class="section-count">${active.length}</span>
          </div>
          ${active.length === 0 ? `<div class="card" style="text-align:center;padding:32px;color:var(--text-dim)">No active projects. Create a new one or reactivate a completed project.</div>` :
          `<div class="projects-grid">${active.map(p => projectCard(p, false)).join('')}</div>`}
        </div>

        <!-- Completed Projects -->
        <div class="dashboard-section">
          <div class="dashboard-section-header">
            <h2>Completed Projects</h2>
            <span class="section-count">${completed.length}</span>
          </div>
          ${completed.length === 0 ? `<div class="card" style="text-align:center;padding:32px;color:var(--text-dim)">Projects you mark as complete will appear here for viewing reports.</div>` :
          `<div class="projects-grid">${completed.map(p => projectCard(p, true)).join('')}</div>`}
        </div>
      `}
    </div>`;

}

function projectCard(p, isArchived) {
  const editIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 1.5l3 3-9 9H2.5v-3l9-9z"/><path d="M10 3l3 3"/></svg>';
  const viewIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8s3-5 7-5 7 5 7 5-3 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/></svg>';

  return `<div class="project-card ${isArchived ? 'archived' : ''}" onclick="navigate('#/project/${p.id}')">
    <div style="display:flex;align-items:start;gap:8px">
      <div style="flex:1">
        <h3>${esc(p.title)}</h3>
        <div class="meta">${esc(p.production_company || '')}${p.client ? ' &bull; ' + esc(p.client) : ''}</div>
      </div>
      <span class="status-badge ${isArchived ? 'completed' : 'active'}">${isArchived ? 'Complete' : 'Active'}</span>
    </div>
    <div class="stats">
      <span><strong>${p.dayCount || 0}</strong> ${p.dayCount === 1 ? 'day' : 'days'}</span>
      <span><strong>${fmtSize(p.totals?.gb || 0)}</strong></span>
      <span><strong>${p.totals?.duration?.substring(0,8) || '00:00:00'}</strong></span>
    </div>
    <div class="card-actions">
      ${isArchived ? `
        <a class="view-link" onclick="navigate('#/project/${p.id}')">${viewIcon} View Reports</a>
      ` : `
        <a class="edit-link" onclick="navigate('#/project/${p.id}')">${editIcon} Edit Project</a>
      `}
      <div class="ellipsis-wrap" onclick="event.stopPropagation()">
        <button class="ellipsis-btn" onclick="event.stopPropagation(); toggleMenu(this)" aria-haspopup="menu" aria-expanded="false">&#8943;</button>
        <div class="ellipsis-menu">
          <button onclick="exportHTML(${p.id})">Export HTML</button>
          <button onclick="exportPDF(${p.id})">Export PDF</button>
          <div class="menu-divider"></div>
          ${p.share_token ? `
            <button onclick="copyShareLink('${esc(p.share_token)}')">Copy share link</button>
            <button onclick="confirmDisableShare(${p.id})">Delete share link</button>
          ` : `
            <button onclick="createShareLink(${p.id})">Create share link</button>
          `}
          <div class="menu-divider"></div>
          ${isArchived ? `
            <button onclick="archiveProject(${p.id}, false)">Reactivate Project</button>
          ` : `
            <button onclick="archiveProject(${p.id}, true)">Mark as Complete</button>
          `}
          <div class="menu-divider"></div>
          <button class="danger" onclick="deleteProject(${p.id})">Delete Project</button>
        </div>
      </div>
    </div>
  </div>`;
}

function toggleMenu(btn) {
  const menu = btn.nextElementSibling;
  const wasOpen = menu.classList.contains('open');
  closeAllMenus();
  if (!wasOpen) { menu.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); }
}

function closeAllMenus() {
  document.querySelectorAll('.ellipsis-menu.open').forEach(m => {
    m.classList.remove('open');
    m.previousElementSibling?.setAttribute('aria-expanded', 'false');
  });
}

// Global click-outside to close menus
document.addEventListener('click', (e) => {
  if (!e.target.closest('.ellipsis-btn')) closeAllMenus();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeAllMenus(); closeSourcePicker(); }
});

async function createProject() {
  const title = await modalPrompt('Project title:');
  if (!title) return;
  const { id } = await api('/projects', { method: 'POST', body: { title } });
  navigate('#/project/' + id);
}

async function deleteProject(id) {
  closeAllMenus();
  if (!await modalConfirm('Delete this project and all its data? This cannot be undone.')) return;
  await api('/projects/' + id, { method: 'DELETE' });
  render();
}

async function archiveProject(id, archived) {
  closeAllMenus();
  await api('/projects/' + id, { method: 'PUT', body: { archived: archived ? 1 : 0 } });
  toast(archived ? 'Project marked as complete' : 'Project reactivated');
  render();
}

// Share links
async function copyShareUrl(token) {
  const url = `${location.origin}/api/r/${token}`;
  try { await navigator.clipboard.writeText(url); } catch (err) { console.error('Clipboard write failed', err); }
  toast('Link copied');
}

async function createShareLink(id) {
  closeAllMenus();
  const { token } = await api('/projects/' + id + '/share', { method: 'POST' });
  await copyShareUrl(token);
  render();
}

function copyShareLink(token) {
  closeAllMenus();
  copyShareUrl(token);
}

async function disableShareLink(id) {
  closeAllMenus();
  await api('/projects/' + id + '/share', { method: 'DELETE' });
  toast('Share link deleted');
  render();
}

async function confirmDisableShare(id) {
  if (!await modalConfirm('Delete this share link? Anyone with the link will lose access. You can create a new link afterward.')) return;
  await disableShareLink(id);
}

// ===== Project Page =====
async function renderProject(app, id) {
  const project = await api('/projects/' + id);

  app.innerHTML = `
    ${impersonateBannerHTML()}
    <div class="nav">

async function addDay(projectId) {
  const date = await modalPrompt('Shoot date:', new Date().toISOString().slice(0, 10), 'date');
  if (!date) return;
  const { id } = await api('/projects/' + projectId + '/days', { method: 'POST', body: { date } });
  navigate('#/project/' + projectId + '/day/' + id);
}

async function cloneDay(dayId) {
  const date = await modalPrompt('Date for the new cloned day:', new Date().toISOString().slice(0, 10), 'date');
  if (!date) return;
  await api('/days/' + dayId + '/clone', { method: 'POST', body: { date } });
  toast('Day cloned');
  render();
}

async function deleteDay(dayId, projectId) {
  if (!await modalConfirm('Delete this day and all its data?')) return;
  await api('/days/' + dayId, { method: 'DELETE' });
  render();
}

async function exportHTML(id) {
  const token = await window.Clerk.session.getToken();
  const headers = { 'Authorization': `Bearer ${token}` };
  if (impersonatingUserId) headers['x-impersonate-user'] = impersonatingUserId;
  const res = await fetch(API + '/projects/' + id + '/export/html', { headers });
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (res.headers.get('Content-Disposition') || '').match(/filename="(.+)"/)?.[1] || 'report.html';
  a.click();
  URL.revokeObjectURL(url);
}

async function exportPDF(id) {
  const token = await window.Clerk.session.getToken();
  const headers = { 'Authorization': `Bearer ${token}` };
  if (impersonatingUserId) headers['x-impersonate-user'] = impersonatingUserId;
  const res = await fetch(API + '/projects/' + id + '/export/pdf', { headers });
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (res.headers.get('Content-Disposition') || '').match(/filename="(.+)"/)?.[1] || 'report.pdf';
  a.click();
  URL.revokeObjectURL(url);
}

function cameraCard(c) {
  const type = c.source_type || 'camera';
  const brand = detectBrand(c.camera_name);
  const typeLabels = { camera: 'Video', audio: 'Audio', photo: 'Photo', misc: 'Misc Source' };

  let fields = '';
  const hints = {
    red:       { res: '8K 17:9', codec: 'R3D', cs: 'REDWideGamutRGB', gamma: 'Log3G10', lut: 'Rec709' },
    arri:      { res: '4.6K 3:2', codec: 'ARRIRAW', cs: 'AWG4', gamma: 'LogC4', lut: 'ALF-4 Rec709' },
    sony:      { res: '4K 16:9', codec: 'XAVC', cs: 'S-Gamut3.Cine', gamma: 'S-Log3', lut: 'LC-709TypeA' },
    canon:     { res: '6K', codec: 'Cinema RAW Light', cs: 'Cinema Gamut', gamma: 'Canon Log 2', lut: 'Rec709' },
    blackmagic:{ res: '6K', codec: 'BRAW', cs: 'Blackmagic Wide Gamut', gamma: 'BMD Film Gen5', lut: 'Rec709' },
    dji:       { res: '8K', codec: 'CinemaDNG', cs: 'D-Gamut', gamma: 'D-Log M', lut: 'Rec709' },
    nikon:     { res: '8K', codec: 'N-RAW', cs: 'N-Gamut', gamma: 'N-Log', lut: 'Rec709' },
    apple:     { res: '4K', codec: 'Apple ProRes', cs: 'Rec. 2020 HLG', gamma: 'Apple Log', lut: 'Rec709' },
  };
  const h = hints[brand] || { res: '4K 16:9', codec: 'ProRes 4444', cs: 'Rec709', gamma: 'Log', lut: 'Rec709' };
  if (type === 'camera') {
    fields = `
      <div class="full"><div class="form-group"><label>Camera</label><input value="${esc(c.camera_name)}" data-field="camera_name" data-type="camera"></div></div>
      <div class="form-group"><label>Label</label><input value="${esc(c.label)}" data-field="label" data-type="camera" placeholder="ACAM"></div>
      <div class="form-group"><label>Resolution</label><input value="${esc(c.resolution)}" data-field="resolution" data-type="camera" placeholder="e.g. ${h.res}"></div>
      <div class="form-group"><label>FPS</label><input value="${esc(c.fps)}" data-field="fps" data-type="camera" placeholder="e.g. 23.976"></div>
      <div class="form-group"><label>Codec</label><input value="${esc(c.codec)}" data-field="codec" data-type="camera" placeholder="e.g. ${h.codec}"></div>
      <div class="form-group"><label>Colorspace</label><input value="${esc(c.colorspace)}" data-field="colorspace" data-type="camera" placeholder="e.g. ${h.cs}"></div>
      <div class="form-group"><label>Gamma</label><input value="${esc(c.gamma || '')}" data-field="gamma" data-type="camera" placeholder="e.g. ${h.gamma}"></div>
      <div class="form-group"><label>LUT</label><input value="${esc(c.lut)}" data-field="lut" data-type="camera" placeholder="e.g. ${h.lut}"></div>
      <div class="form-group"><label>Audio</label><input value="${esc(c.audio)}" data-field="audio" data-type="camera" placeholder="e.g. Onboard Scratch"></div>`;
  } else if (type === 'audio') {
    fields = `
      <div class="full"><div class="form-group"><label>Device</label><input value="${esc(c.camera_name)}" data-field="camera_name" data-type="camera" placeholder="e.g. Sound Devices 888"></div></div>
      <div class="form-group"><label>Label</label><input value="${esc(c.label)}" data-field="label" data-type="camera" placeholder="SOUND"></div>
      <div class="form-group"><label>Sample Rate</label><input value="${esc(c.resolution)}" data-field="resolution" data-type="camera" placeholder="48kHz"></div>
      <div class="form-group"><label>Bit Depth</label><input value="${esc(c.codec)}" data-field="codec" data-type="camera" placeholder="24-bit"></div>
      <div class="form-group"><label>Channels</label><input value="${esc(c.audio)}" data-field="audio" data-type="camera" placeholder="8"></div>
      <div class="form-group"><label>Notes</label><input value="${esc(c.notes)}" data-field="notes" data-type="camera"></div>`;
  } else if (type === 'photo') {
    fields = `
      <div class="full"><div class="form-group"><label>Camera</label><input value="${esc(c.camera_name)}" data-field="camera_name" data-type="camera" placeholder="e.g. Canon R5"></div></div>
      <div class="form-group"><label>Label</label><input value="${esc(c.label)}" data-field="label" data-type="camera" placeholder="BTS"></div>
      <div class="form-group"><label>Format</label><input value="${esc(c.codec)}" data-field="codec" data-type="camera" placeholder="RAW / JPEG"></div>
      <div class="form-group"><label>Notes</label><input value="${esc(c.notes)}" data-field="notes" data-type="camera"></div>`;
  } else {
    fields = `
      <div class="full"><div class="form-group"><label>Source</label><input value="${esc(c.camera_name)}" data-field="camera_name" data-type="camera" placeholder="e.g. Screen Recording"></div></div>
      <div class="form-group"><label>Label</label><input value="${esc(c.label)}" data-field="label" data-type="camera"></div>
      <div class="form-group"><label>Resolution</label><input value="${esc(c.resolution)}" data-field="resolution" data-type="camera"></div>
      <div class="form-group"><label>Codec</label><input value="${esc(c.codec)}" data-field="codec" data-type="camera" class="mono"></div>
      <div class="form-group"><label>Notes</label><input value="${esc(c.notes)}" data-field="notes" data-type="camera"></div>`;
  }

  return `<div class="admin-camera-card" data-id="${c.id}">
    <span class="drag-handle" aria-hidden="true">&#8942;&#8942;</span>
    ${brand ? `<img class="brand-logo brand-${brand}" src="/icons/cameras/${brand}.svg?v=2" alt="">` : ''}

      <div class="ellipsis-menu">

        <div class="menu-divider"></div>
        <button class="danger" onclick="deleteCamera(${c.id})">Delete Source</button>
      </div>
    </div>
    <span class="source-type-badge type-${type}">${typeLabels[type]}</span>
    <div class="cam-form">${fields}</div>
  </div>`;
}

function rollRow(r, cameras) {

  return `<tr data-id="${r.id}">
    <td class="drag-handle-cell"><span class="drag-handle" aria-hidden="true">&#8942;&#8942;</span></td>
    <td><input value="${esc(r.roll_name)}" data-field="roll_name" class="mono" style="width:130px"></td>

  </tr>`;
}

function incrementRollName(name) {
  const m = /\d+/.exec(name || '');
  if (!m) return 'A001';
  const num = String(Number(m[0]) + 1).padStart(m[0].length, '0');
  return name.slice(0, m.index) + num + name.slice(m.index + m[0].length);
}

async function addRoll(dayId) {

// ===== CSV import =====
const CSV_FIELDS = [
  { value: '', label: 'Skip' },
  { value: 'roll_name', label: 'Roll' },
  { value: 'card_serial', label: 'Card Serial' },
  { value: 'gb', label: 'GB' },
  { value: 'duration_tc', label: 'Duration' },
  { value: 'notes', label: 'Notes' },
];
const CSV_HEADER_KEYWORDS = {
  roll_name: ['name', 'clip', 'reel', 'roll'],
  card_serial: ['serial', 'card', 'volume'],
  gb: ['size', 'gb', 'gigabyte'],
  duration_tc: ['duration', 'timecode', 'tc'],
  notes: ['note', 'comment'],
};

function guessCsvField(header) {
  const h = (header || '').toLowerCase();
  for (const [field, kws] of Object.entries(CSV_HEADER_KEYWORDS)) {
    if (kws.some(k => h.includes(k))) return field;
  }
  return '';
}

// Handles quoted fields (with embedded commas/newlines, "" escapes) and CRLF line endings
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\r') { /* skip, \n closes the row */ }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

// Per-clip offload reports (ShotPut Studio and similar): one row per file per
// copy destination. Detect by their distinctive header set and summarize to one
// roll per card instead of asking the user to map 25+ columns.
function isClipReport(headers) {
  const h = headers.map(c => c.trim().toLowerCase());
  return h.includes('group') && h.includes('path') && h.includes('status') &&
    (h.includes('xxhash64') || h.includes('video duration') || h.includes('total frames'));
}

function parseClockToSeconds(v) {
  const p = String(v || '').trim().split(':').map(Number);
  if (!p.length || p.some(isNaN)) return 0;
  if (p.length === 4) p.pop(); // HH:MM:SS:FF — drop frames
  while (p.length < 3) p.unshift(0);
  return p[0] * 3600 + p[1] * 60 + p[2];
}

function secondsToTC(secs) {
  const pad = n => String(n).padStart(2, '0');
  return `${pad(Math.floor(secs / 3600))}:${pad(Math.floor(secs / 60) % 60)}:${pad(secs % 60)}:00`;
}

function aggregateClipReport(headers, dataRows) {
  const idx = {};
  headers.forEach((h, i) => { idx[h.trim().toLowerCase()] = i; });
  const gi = idx['group'], ni = idx['name'], pi = idx['path'], si = idx['size'], sti = idx['status'], vdi = idx['video duration'];
  // Collapse the copies: each Group id is one file/folder, listed once per destination
  const groups = new Map();
  for (const r of dataRows) {
    const g = r[gi];
    if (g === undefined || g === '') continue;
    let e = groups.get(g);
    if (!e) { e = { name: r[ni] || '', srcPath: '', gb: 0, dur: '', verified: 0 }; groups.set(g, e); }
    const status = (r[sti] || '').trim().toLowerCase();
    const sz = parseSizeToGb(r[si]);
    if (status === 'verified') e.verified++;
    if (status === 'offloaded') { e.srcPath = r[pi] || ''; if (sz) e.gb = sz; }
    else if (!e.gb && sz) e.gb = sz;
    const vd = vdi !== undefined ? (r[vdi] || '').trim() : '';
    if (vd) e.dur = vd;
  }
  // Media clips are the entities with a video duration; group them by card volume
  const rootName = groups.get('0')?.name || '';
  const cards = new Map();
  for (const e of groups.values()) {
    if (!e.dur) continue;
    const m = e.srcPath.match(/^\/Volumes\/([^\/]+)/);
    const card = m ? m[1] : (rootName || 'CARD');
    let c = cards.get(card);
    if (!c) { c = { roll_name: card, gb: 0, secs: 0, clips: 0, minVerified: Infinity }; cards.set(card, c); }
    c.gb += e.gb;
    c.secs += parseClockToSeconds(e.dur);
    c.clips++;
    c.minVerified = Math.min(c.minVerified, e.verified);
  }
  return [...cards.values()].map(c => ({
    roll_name: c.roll_name, card_serial: '', gb: Math.round(c.gb * 100) / 100,
    duration_tc: secondsToTC(c.secs),
    master: c.minVerified >= 1 ? 1 : 0, backup: c.minVerified >= 2 ? 1 : 0,
    notes: '', clips: c.clips,
  }));
}

// MB/GB/TB suffixes convert directly; unitless large numbers are treated as raw bytes
function parseSizeToGb(v) {
  const s = String(v || '').trim().replace(/,/g, '');
  const m = s.match(/^([\d.]+)\s*([a-zA-Z]*)$/);
  if (!m) return parseFloat(s) || 0;
  const num = parseFloat(m[1]) || 0;
  const unit = m[2].toUpperCase();
  if (unit.startsWith('TB')) return num * 1000;
  if (unit.startsWith('MB')) return num / 1000;
  if (unit.startsWith('KB')) return num / 1e6;
  if (unit === 'B' || unit === 'BYTES') return num / 1e9;
  if (unit === '' && num > 1e6) return num / 1e9; // bytes-like magnitude, no unit given
  return num;
}

function openCsvImport(dayId) {
  const overlay = showModal(`
    <h3>Import CSV</h3>
    <div class="csv-drop" id="csvDrop" tabindex="0" role="button" aria-label="Drop a CSV file here, or click to paste in the text area below">Drop a CSV file or paste below</div>
    <textarea id="csvText" rows="5" style="width:100%;margin-bottom:16px;font-family:monospace;font-size:12px" placeholder="roll,serial,gb,duration"></textarea>
    <div id="csvMapWrap"></div>
    <div id="csvPreviewWrap"></div>
    <div class="modal-actions">
      <button class="btn modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="csvImportBtn" disabled>Import</button>
    </div>
  `);
  overlay.querySelector('.modal').style.maxWidth = '680px';

  const drop = overlay.querySelector('#csvDrop');
  const textEl = overlay.querySelector('#csvText');
  const mapWrap = overlay.querySelector('#csvMapWrap');
  const prevWrap = overlay.querySelector('#csvPreviewWrap');
  const importBtn = overlay.querySelector('#csvImportBtn');
  let parsed = null;
  let manualMode = false; // user opted out of clip-report summarization

  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { textEl.value = reader.result; parseAndRender(); };
    reader.readAsText(file);
  });
  drop.addEventListener('click', () => textEl.focus());
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); textEl.focus(); } });
  textEl.addEventListener('input', parseAndRender);

  function parseAndRender() {
    const text = textEl.value.trim();
    if (!text) { mapWrap.innerHTML = ''; prevWrap.innerHTML = ''; importBtn.disabled = true; parsed = null; return; }
    const rows = parseCSV(text);
    if (!rows.length) { mapWrap.innerHTML = ''; prevWrap.innerHTML = ''; importBtn.disabled = true; parsed = null; return; }
    const first = rows[0];

    // Per-clip offload report → summarize to one roll per card
    if (!manualMode && isClipReport(first)) {
      const clipRolls = aggregateClipReport(first, rows.slice(1));
      if (clipRolls.length) {
        parsed = { clipMode: true, clipRolls };
        mapWrap.innerHTML = '';
        renderClipPreview();
        importBtn.disabled = false;
        return;
      }
    }

    const hasHeader = first.some(c => guessCsvField(c) !== '');
    let headers, dataRows, mapping;
    if (hasHeader) {
      headers = first;
      dataRows = rows.slice(1);
      mapping = headers.map(h => guessCsvField(h));
      // First column wins each field; repeats fall back to Skip
      const seen = new Set();
      mapping = mapping.map(f => { if (!f || seen.has(f)) return ''; seen.add(f); return f; });
    } else {
      headers = first.map((_, i) => `Column ${i + 1}`);
      dataRows = rows;
      const defaults = ['roll_name', 'card_serial', 'gb', 'duration_tc'];
      mapping = first.map((_, i) => defaults[i] || '');
    }
    parsed = { headers, dataRows, mapping };
    renderMapping();
    renderPreview();
    importBtn.disabled = false;
  }

  function renderClipPreview() {
    prevWrap.innerHTML = `<div class="section-title"><h3>Summary</h3></div>
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:12px">Per-clip offload report detected. Clips are summarized into one roll per card; master and backup reflect each clip's verified copies.</p>
      <div style="overflow-x:auto;margin-bottom:8px"><table class="data-table">
        <thead><tr><th>Roll</th><th>Clips</th><th style="text-align:right">Size</th><th>Duration</th><th style="text-align:center">Master</th><th style="text-align:center">Backup</th></tr></thead>
        <tbody>${parsed.clipRolls.map(r => `<tr>
          <td class="mono">${esc(r.roll_name)}</td>
          <td>${r.clips}</td>
          <td class="mono" style="text-align:right">${fmtSize(r.gb)}</td>
          <td class="mono">${esc(r.duration_tc)}</td>
          <td style="text-align:center">${r.master ? '&#10003;' : '&mdash;'}</td>
          <td style="text-align:center">${r.backup ? '&#10003;' : '&mdash;'}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      <button type="button" class="btn btn-sm" id="csvManualBtn" style="margin-bottom:8px">Map columns manually instead</button>`;
    prevWrap.querySelector('#csvManualBtn').addEventListener('click', () => { manualMode = true; parseAndRender(); });
  }

  function renderMapping() {
    mapWrap.innerHTML = `<div class="section-title"><h3>Map Columns</h3></div>
      <div class="form-grid cols-4">
        ${parsed.headers.map((h, i) => `
          <div class="form-group">
            <label>${esc(h)}</label>
            <select data-col="${i}" class="csv-map-select">
              ${CSV_FIELDS.map(f => `<option value="${f.value}" ${parsed.mapping[i] === f.value ? 'selected' : ''}>${f.label}</option>`).join('')}
            </select>
          </div>`).join('')}
      </div>`;
    mapWrap.querySelectorAll('.csv-map-select').forEach(sel => {
      sel.addEventListener('change', () => { parsed.mapping[+sel.dataset.col] = sel.value; renderPreview(); });
    });
  }

  function renderPreview() {
    prevWrap.innerHTML = `<div class="section-title"><h3>Preview</h3></div>
      <div style="overflow-x:auto;margin-bottom:8px"><table class="data-table">
        <thead><tr>${parsed.mapping.map(f => f ? `<th>${esc(CSV_FIELDS.find(x => x.value === f).label)}</th>` : '').join('')}</tr></thead>
        <tbody>${parsed.dataRows.slice(0, 5).map(r => `<tr>${parsed.mapping.map((f, i) => f ? `<td>${esc(r[i] || '')}</td>` : '').join('')}</tr>`).join('')}</tbody>
      </table></div>
      <div style="color:var(--text-dim);font-size:12px">${parsed.dataRows.length} row${parsed.dataRows.length === 1 ? '' : 's'} detected</div>`;
  }

  importBtn.addEventListener('click', async () => {
    if (!parsed) return;
    if (parsed.clipMode) {
      const rolls = parsed.clipRolls.map(({ clips, ...roll }) => roll);
      try {
        const { ids } = await api('/days/' + dayId + '/rolls/bulk', { method: 'POST', body: { rolls } });
        closeModal(overlay);
        toast(`Imported ${ids.length} roll${ids.length === 1 ? '' : 's'}`);
        render();
      } catch (err) {
        toast('Import failed');
      }
      return;
    }
    const rolls = parsed.dataRows.map(r => {
      const obj = {};
      parsed.mapping.forEach((f, i) => {
        if (!f) return;
        const raw = (r[i] || '').trim();
        obj[f] = f === 'gb' ? parseSizeToGb(raw) : raw;
      });
      return obj;
    }).filter(r => Object.keys(r).length > 0);
    if (!rolls.length) { closeModal(overlay); return; }
    try {
      const { ids } = await api('/days/' + dayId + '/rolls/bulk', { method: 'POST', body: { rolls } });
      closeModal(overlay);
      toast(`Imported ${ids.length} roll${ids.length === 1 ? '' : 's'}`);
      render();
    } catch (err) {
      toast('Import failed');
    }
  });
  overlay.querySelector('.modal-cancel').addEventListener('click', () => closeModal(overlay));
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(overlay); });
  document.addEventListener('keydown', function escHandler(e) {
    if (e.key !== 'Escape') return;
    document.removeEventListener('keydown', escHandler);
    closeModal(overlay);
  });
}

// ===== Undoable delete =====
const pendingDeletes = new Map(); // key `${entity}:${id}` -> timeoutId

function optimisticDelete(entity, id, apiPath) {
  const key = `${entity}:${id}`;
  clearTimeout(pendingDeletes.get(key));
  const timer = setTimeout(async () => {
    pendingDeletes.delete(key);
    try { await api(apiPath, { method: 'DELETE' }); }
    catch (err) { console.error('Delete failed', err); }
  }, 6000);
  pendingDeletes.set(key, timer);
  toastUndo('Deleted', () => {
    clearTimeout(pendingDeletes.get(key));
    pendingDeletes.delete(key);
    render();
  });
}

// Re-hide rows whose delete is still pending after a re-render (e.g. an undo elsewhere)
function reapplyPendingDeletes() {
  for (const key of pendingDeletes.keys()) {
    const [entity, id] = key.split(':');
    const sel = entity === 'roll' ? `#rollsBody tr[data-id="${id}"]`
      : entity === 'benchmark' ? `#benchTable tr[data-id="${id}"]`
      : `#cameraCards [data-id="${id}"]`;
    document.querySelector(sel)?.remove();
  }
}

// ===== Drag reorder =====
let dragSrcEl = null;

function initDragReorder(containerSel, itemSel, reorderFn) {
  const container = document.querySelector(containerSel);
  if (!container) return;
  container.querySelectorAll(itemSel).forEach(item => {
    const handle = item.querySelector('.drag-handle');
    if (!handle) return;
    handle.addEventListener('mousedown', () => { item.draggable = true; });
    item.addEventListener('dragstart', e => {
      dragSrcEl = item;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', item.dataset.id);
    });
    item.addEventListener('dragend', () => {
      item.draggable = false;
      container.querySelectorAll(itemSel).forEach(i => i.classList.remove('drag-over'));
      dragSrcEl = null;
    });
    item.addEventListener('dragover', e => {
      if (!dragSrcEl || dragSrcEl === item) return;
      e.preventDefault();
      container.querySelectorAll(itemSel).forEach(i => i.classList.remove('drag-over'));
      item.classList.add('drag-over');
    });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', async e => {
      e.preventDefault();
      item.classList.remove('drag-over');
      if (!dragSrcEl || dragSrcEl === item) return;
      item.parentNode.insertBefore(dragSrcEl, item);
      const ids = [...container.querySelectorAll(itemSel)].map(i => Number(i.dataset.id));
      setSyncStatus('saving');
      try { await reorderFn(ids); setSyncStatus('saved'); }
      catch (err) { console.error('Reorder failed', err); setSyncStatus('offline'); toast('Reorder failed'); }
    });
  });
}

// ===== Save queue =====
const pending = new Map(); // key `${entity}:${id}:${field}` -> {entity,id,field,value}
const saveTimers = new Map();
const entityBase = { roll: '/rolls/', benchmark: '/benchmarks/', camera: '/cameras/', project: '/projects/', day: '/days/' };

function saveContext(target) {
  const field = target.dataset.field;
  if (!field) return null;
  if (target.dataset.type === 'camera') {
    const id = target.closest('[data-id]')?.dataset.id;
    return id ? { entity: 'camera', id, field } : null;
  }
  if (target.closest('#benchTable')) {
    const id = target.closest('[data-id]')?.dataset.id;
    return id ? { entity: 'benchmark', id, field } : null;
  }
  if (target.closest('#rollsTable')) {
    const id = target.closest('[data-id]')?.dataset.id;
    return id ? { entity: 'roll', id, field } : null;
  }
  if (target.closest('#projectForm')) {
    const id = getRoute().projectId;
    return id ? { entity: 'project', id, field } : null;
  }
  if (target.id === 'dayNumber' || target.id === 'dayDate') {
    const id = getRoute().dayId;
    return id ? { entity: 'day', id, field } : null;
  }
  return null;
}

function queueSave(entity, id, field, value) {
  const key = `${entity}:${id}:${field}`;
  pending.set(key, { entity, id, field, value });
  clearTimeout(saveTimers.get(key));
  saveTimers.set(key, setTimeout(() => flushEntity(entity, id), 400));
}

function flushKey(key) {
  if (!pending.has(key)) return;
  clearTimeout(saveTimers.get(key));
  saveTimers.delete(key);
  const [entity, id] = key.split(':');
  flushEntity(entity, id);
}

async function flushEntity(entity, id) {
  const prefix = `${entity}:${id}:`;
  const entries = [...pending].filter(([k]) => k.startsWith(prefix));
  if (!entries.length) return;
  entries.forEach(([k]) => { clearTimeout(saveTimers.get(k)); saveTimers.delete(k); pending.delete(k); });
  persistPending();
  setSyncStatus('saving');
  const body = {};
  entries.forEach(([, v]) => { body[v.field] = v.value; });
  try {
    await api(entityBase[entity] + id, { method: 'PUT', body });
    setSyncStatus('saved');
  } catch (err) {
    console.error('Save failed', err);
    entries.forEach(([k, v]) => pending.set(k, v));
    persistPending();
    setSyncStatus('offline');
  }
}

function persistPending() {
  try {
    if (pending.size === 0) localStorage.removeItem('dit-pending-saves');
    else localStorage.setItem('dit-pending-saves', JSON.stringify([...pending.values()]));
  } catch {}
}

function loadPersistedPending() {
  try {
    const raw = localStorage.getItem('dit-pending-saves');
    if (!raw) return;
    for (const item of JSON.parse(raw)) pending.set(`${item.entity}:${item.id}:${item.field}`, item);
  } catch {}
}

function retryPending() {
  const groups = new Set([...pending.keys()].map(k => k.split(':').slice(0, 2).join(':')));
  groups.forEach(g => { const [entity, id] = g.split(':'); flushEntity(entity, id); });
}

let syncState = null;
let syncFadeTimer;
function setSyncStatus(state) { syncState = state; paintSyncStatus(); }
function paintSyncStatus() {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  clearTimeout(syncFadeTimer);
  el.classList.remove('saving', 'saved', 'offline', 'fade');
  const label = el.querySelector('.sync-label');
  if (syncState === 'saving') { el.classList.add('saving'); label.textContent = 'Saving…'; }
  else if (syncState === 'saved') {
    el.classList.add('saved'); label.textContent = 'Saved';
    syncFadeTimer = setTimeout(() => el.classList.add('fade'), 2000);
  } else if (syncState === 'offline') { el.classList.add('offline'); label.textContent = 'Offline — will retry'; }
  else label.textContent = '';
}

function handleFieldEvent(e) {
  const ctx = saveContext(e.target);
  if (!ctx) return;
  const numericFields = ['write_speed', 'read_speed', 'gb'];
  let value = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (ctx.field === 'camera_id') value = value === '' ? null : parseInt(value, 10);
  else if (e.target.type === 'number' || numericFields.includes(ctx.field)) value = parseFloat(value) || 0;

  // Validate timecode
  if (ctx.field === 'duration_tc') {
    const valid = /^\d{2}:\d{2}:\d{2}:\d{2}$/.test(value);
    e.target.classList.toggle('invalid', value && !valid);
  }

  queueSave(ctx.entity, ctx.id, ctx.field, value);
  if (ctx.entity === 'roll' && (ctx.field === 'gb' || ctx.field === 'duration_tc')) updateDayTotals();
}
document.addEventListener('input', handleFieldEvent);
// Selects don't reliably fire 'input' on every browser; 'change' covers them too (idempotent with the above)
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT') handleFieldEvent(e); });

document.addEventListener('focusout', e => {
  const ctx = saveContext(e.target);
  if (ctx) flushKey(`${ctx.entity}:${ctx.id}:${ctx.field}`);
});

// Recompute the day totals bar from the live DOM (optimistic, no fetch)
function updateDayTotals() {
  const el = document.getElementById('dayTotals');
  if (!el) return;
  const rows = document.querySelectorAll('#rollsBody tr');
  let totalGb = 0;
  const tcs = [];
  rows.forEach(row => {
    totalGb += parseFloat(row.querySelector('[data-field="gb"]')?.value) || 0;
    const tc = row.querySelector('[data-field="duration_tc"]')?.value;
    if (tc && /^\d{2}:\d{2}:\d{2}:\d{2}$/.test(tc)) tcs.push(tc);
  });
  el.innerHTML = `
    <div><div class="t-label">Total Data</div><div class="t-value">${fmtSize(totalGb)}</div></div>
    <div><div class="t-label">Total Duration</div><div class="t-value">${sumTC(tcs)}</div></div>
    <div><div class="t-label">Rolls</div><div class="t-value">${rows.length}</div></div>`;
}

function sumTC(tcs) {
  let h=0, m=0, s=0, f=0;
  for (const tc of tcs) {
    const p = tc.split(':').map(Number);
    h += p[0]; m += p[1]; s += p[2]; f += p[3];
  }
  s += Math.floor(f / 24); f = f % 24;
  m += Math.floor(s / 60); s = s % 60;
  h += Math.floor(m / 60); m = m % 60;
  const pad = n => String(n).padStart(2, '0');
  return `${pad(h)}:${pad(m)}:${pad(s)}:${pad(f)}`;
}

function esc(s) {
  if (!s && s !== 0) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function detectBrand(name) {
  const n = (name || '').toUpperCase();
  const brands = {
    red: ['V-RAPTOR','KOMODO','RED ONE','EPIC-X','EPIC-W','EPIC-M','SCARLET-W','SCARLET-X','RAVEN','WEAPON','MONSTRO','HELIUM','GEMINI','DRAGON','RANGER','DSMC','RED EPIC','RED SCARLET','RED RAVEN','RED RANGER','KOMODO-X'],
    arri: ['ALEXA','AMIRA','ARRICAM','ARRIFLEX'],
    blackmagic: ['URSA','BMPCC','PYXIS','POCKET CINEMA','MICRO CINEMA','BLACKMAGIC'],
    sony: ['VENICE','BURANO','FX3','FX30','FX6','FX9','FR7','A7S','A7R','A7C','A7 IV','A7IV','A9 ','A1 ','F5 ','F55','F65','FS5','FS7','FS100','FS700','CINEALTA','HDW-F'],
    canon: ['C70','C80','C100','C200','C300','C400','C500','C700','R5 C','R5C','EOS C','CINEMA EOS','1D C','1DC'],
    dji: ['RONIN','ZENMUSE','INSPIRE','MAVIC','OSMO','AVATA','AIR 2S','MINI 3','MINI 4','DJI ACTION'],
    nikon: ['NIKON Z','Z5','Z6','Z7','Z8','Z9','Z30','Z50',' ZR',' ZF',' ZFC'],
    apple: ['IPHONE','IPAD'],
  };
  for (const [brand, keywords] of Object.entries(brands))
    if (keywords.some(k => n.includes(k))) return brand;
  return null;
}

// ===== Admin Panel =====

  if (!currentUser?.isAdmin) {
    app.innerHTML = '<div class="container"><div class="card"><h2>Forbidden</h2><p>You do not have admin access.</p></div></div>';
    return;
  }

  const users = await api('/admin/users');

  app.innerHTML = `
    ${impersonateBannerHTML()}
    <div class="nav">
      <a class="wordmark" href="#/">DIT report</a>
      <button class="back-btn" onclick="navigate('#/')" title="Back to Projects"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg></button>
      <div class="breadcrumb"><a href="#/">Projects</a> / Admin</div>
      <div class="spacer"></div>
      ${userMenuHTML()}
    </div>
    <div class="container">
      <div class="card">
        <h2>Users <span class="section-count" style="font-size:12px;vertical-align:middle">${users.length}</span></h2>
        <div style="margin-bottom:12px">
          <input type="text" id="adminUserSearch" placeholder="Search by name or email..." style="width:100%;max-width:320px">
        </div>
        <div style="overflow-x:auto">
          <table class="admin-table" id="adminUsersTable">
            <thead><tr>
              <th>Name</th><th>Email</th><th>Company</th><th>Status</th><th>Projects</th><th>Signed Up</th><th></th>
            </tr></thead>
            <tbody>
              ${users.map(u => adminUserRow(u)).join('')}
            </tbody>

  document.getElementById('adminUserSearch').addEventListener('input', e => {

      row.style.display = text.includes(q) ? '' : 'none';

}

function adminUserRow(u) {
  const date = u.created_at ? new Date(u.created_at).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) : '';
  const sub = u.subscription_status || 'free';
  const subClass = sub && sub !== 'free' ? 'active' : 'completed';
  return `<tr data-user-id="${esc(u.id)}">
    <td>${esc(u.name || '—')}</td>
    <td style="color:var(--text-dim)">${esc(u.email)}</td>
    <td>${esc(u.company || '—')}</td>
    <td><span class="status-badge ${subClass}" style="font-size:10px">${esc(sub)}</span></td>
    <td>${u.project_count || 0}</td>
    <td style="color:var(--text-dim)">${date}</td>
    <td class="actions">
      <button class="btn btn-sm" onclick="editAdminUser('${esc(u.id)}')">Edit</button>
      <button class="btn btn-sm" onclick="startImpersonating('${esc(u.id)}')">View as</button>
      <button class="btn btn-sm btn-danger" onclick="deleteAdminUser('${esc(u.id)}')">Delete</button>
    </td>
  </tr>`;
}

async function editAdminUser(userId) {
  const user = await api('/admin/users/' + userId);
  const overlay = showModal(`
    <h3>Edit User</h3>
    <div style="margin-bottom:12px;color:var(--text-dim);font-size:13px">${esc(user.email)}</div>
    <div class="form-grid" style="margin-bottom:20px">
      <div class="form-group"><label>Name</label><input id="editUserName" value="${esc(user.name || '')}"></div>
      <div class="form-group"><label>Company</label><input id="editUserCompany" value="${esc(user.company || '')}"></div>
      <div class="form-group"><label>Subscription</label>
        <select id="editUserSub">
          <option value="free" ${user.subscription_status === 'free' ? 'selected' : ''}>Free</option>
          <option value="pro" ${user.subscription_status === 'pro' ? 'selected' : ''}>Pro</option>
          <option value="enterprise" ${user.subscription_status === 'enterprise' ? 'selected' : ''}>Enterprise</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn modal-cancel">Cancel</button>
      <button class="btn btn-primary modal-ok">Save</button>
    </div>
  `);
  overlay.querySelector('.modal-cancel').addEventListener('click', () => closeModal(overlay));
  overlay.querySelector('.modal-ok').addEventListener('click', async () => {
    await api('/admin/users/' + userId, {
      method: 'PUT',
      body: {
        name: document.getElementById('editUserName').value,
        company: document.getElementById('editUserCompany').value,
        subscription_status: document.getElementById('editUserSub').value,
      }
    });
    closeModal(overlay);
    toast('User updated');
    render();
  });
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(overlay); });
}

async function deleteAdminUser(userId) {
  if (!await modalConfirm('Delete this user and ALL their projects? This cannot be undone.')) return;
  await api('/admin/users/' + userId, { method: 'DELETE' });
  toast('User deleted');
  render();
}
