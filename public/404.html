<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — DIT Report</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --basalt: #121410; --parchment: #EBE2CC; --alpenglow: #D1573F;
  --graphite: #0A0A0A; --compass: #FED20B;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--basalt); color: var(--parchment);
  font-size: 15px; line-height: 1.55; letter-spacing: -0.005em;
  min-height: 100vh; display: flex; flex-direction: column;
  padding: 40px 48px;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
.wordmark {
  font-family: 'Space Grotesk', 'Geist', system-ui, sans-serif;
  font-weight: 600; letter-spacing: -0.045em; line-height: 1; font-size: 30px;
}
main { margin: auto; text-align: center; padding: 48px 0; }
.code {
  font-weight: 600; font-size: clamp(96px, 18vw, 160px);
  line-height: 0.96; letter-spacing: -0.045em; color: var(--compass);
}
p { margin-top: 16px; font-size: 17px; color: color-mix(in oklab, var(--parchment) 70%, transparent); }
a.home {
  display: inline-block; margin-top: 32px; padding: 10px 24px;
  background: var(--compass); color: var(--graphite); text-decoration: none;
  font-size: 14px; font-weight: 500; border-radius: 9999px;
  transition: background .15s cubic-bezier(0.2, 0.7, 0.2, 1);
}
a.home:hover { background: color-mix(in oklab, var(--compass) 88%, var(--graphite)); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<span class="wordmark">DIT report</span>
<main>
  <div class="code">404</div>
  <p>No page at that address.</p>
  <a class="home" href="/">Back to the dashboard</a>
</main>
</body>
</html>
