<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — DIT Report</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --basalt: #121410; --parchment: #EBE2CC; --alpenglow: #D1573F;
  --snow: #FFFFFF; --cloud: #F4F2EC; --graphite: #0A0A0A; --smoke: #6F6E6A;
  --border: color-mix(in oklab, var(--graphite) 14%, transparent);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--snow); color: var(--graphite);
  font-size: 15px; line-height: 1.55; letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
.layout { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.wordmark {
  font-family: 'Space Grotesk', 'Geist', system-ui, sans-serif;
  font-weight: 600; letter-spacing: -0.045em; line-height: 1;
}

/* Brand panel — basalt identity anchor */
.brand-panel {
  display: none; background: var(--basalt); color: var(--parchment);
  flex-direction: column; justify-content: space-between;
  padding: 40px 48px; min-height: 100vh;
}
.brand-panel .wordmark { font-size: 30px; }
.brand-panel .pitch { max-width: 26rem; }
.brand-panel .eyebrow {
  font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--alpenglow);
}
.brand-panel h1 {
  margin-top: 16px; font-size: clamp(36px, 3.4vw, 48px); font-weight: 600;
  line-height: 1.02; letter-spacing: -0.035em;
}
.brand-panel .pitch p {
  margin-top: 24px; font-size: 17px; line-height: 1.45;
  color: color-mix(in oklab, var(--parchment) 76%, transparent);
}

/* Sign-in panel */
.signin-panel {
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; padding: 48px 24px 24px;
}
.signin-wrap { margin: auto; width: 100%; max-width: 26rem; display: flex; flex-direction: column; align-items: center; gap: 32px; }
.signin-wrap .wordmark { font-size: 30px; color: var(--graphite); }
#sign-in { min-height: 300px; width: 100%; display: flex; justify-content: center; }
.loading { color: var(--smoke); font-size: 14px; text-align: center; padding-top: 40px; }
.foot { color: var(--smoke); font-size: 12px; padding-top: 24px; }

@media (min-width: 1024px) {
  .layout { grid-template-columns: minmax(320px, 0.62fr) minmax(420px, 1fr); }
  .brand-panel { display: flex; }
  .signin-wrap .wordmark { display: none; }
  .signin-panel { padding: 48px 48px 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
<script>
  const isProd = location.hostname === 'dit.traderjosh.com';
  const s = document.createElement('script');
  s.async = true;
  s.crossOrigin = 'anonymous';
  s.dataset.clerkPublishableKey = isProd
    ? 'pk_live_Y2xlcmsuZGl0LnRyYWRlcmpvc2guY29tJA'
    : 'pk_test_cHJvbXB0LWNvbGxpZS01OC5jbGVyay5hY2NvdW50cy5kZXYk';
  s.src = isProd
    ? 'https://clerk.dit.traderjosh.com/npm/@clerk/clerk-js@5/dist/clerk.browser.js'
    : 'https://prompt-collie-58.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
  document.head.appendChild(s);
</script>
</head>
<body>
<div class="layout">
  <section class="brand-panel">
    <span class="wordmark">DIT report</span>
    <div class="pitch">
      <p class="eyebrow">On-set data management</p>
      <h1>Every card, accounted for.</h1>
      <p>Offload logs, drive benchmarks, and shoot-day reports in one place.</p>
    </div>
  </section>

  <section class="signin-panel">
    <div class="signin-wrap">
      <span class="wordmark">DIT report</span>
      <div id="sign-in"><div class="loading">Loading&hellip;</div></div>
    </div>
    <p class="foot">&copy; 2026 DIT Report</p>
  </section>
</div>

<script>
window.addEventListener('load', async () => {
  await window.Clerk.load();
  if (window.Clerk.user) {
    window.location.href = '/app.html';
    return;
  }
  document.getElementById('sign-in').innerHTML = '';
  window.Clerk.mountSignIn(document.getElementById('sign-in'), {
    appearance: {
      variables: {
        colorPrimary: '#0A0A0A',
        colorBackground: '#FFFFFF',
        colorText: '#0A0A0A',
        colorInputBackground: '#FFFFFF',
        colorInputText: '#0A0A0A',
        colorNeutral: '#0A0A0A',
        borderRadius: '8px',
        fontFamily: "'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif",
      },
      elements: {
        card: {
          backgroundColor: '#FFFFFF',
          border: '1px solid rgba(10,10,10,.14)',
          boxShadow: '0 12px 32px rgba(18,20,16,.10)',
        },
        socialButtons: {
          display: 'flex',
          flexDirection: 'column-reverse',
          gap: '8px',
        },
        socialButtonsBlockButton: {
          backgroundColor: '#FFFFFF',
          border: '1px solid rgba(10,10,10,.14)',
          color: '#0A0A0A',
          borderRadius: '9999px',
          '&:hover': { backgroundColor: '#F4F2EC', borderColor: 'rgba(10,10,10,.32)' },
        },
        formButtonPrimary: {
          backgroundColor: '#0A0A0A',
          color: '#FFFFFF',
          borderRadius: '9999px',
          '&:hover': { backgroundColor: '#2A2A2A' },
        },
        footerActionLink: {
          color: '#0A0A0A',
        },
        dividerLine: {
          borderColor: 'rgba(10,10,10,.14)',
        },
      },
    },
    afterSignInUrl: '/app.html',
    afterSignUpUrl: '/app.html',
  });
});
</script>
</body>
</html>
